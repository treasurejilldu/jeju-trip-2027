function tips(){return `<div class="section-head"><h2>旅前實用須知</h2><small>入境 · 天氣 · 支付 · 退稅</small></div>

<div class="card"><h3>🛂 入境韓國・SES</h3><p>台灣護照短期觀光一般可免簽，但 <b>2027 年是否需要 K-ETA</b>，務必出發前確認。若適用 e-Arrival Card 電子入境申報，請在規定期間內從官方網站免費填寫。</p><p><b>SES 自動通關</b>與 K-ETA、電子入境卡是不同制度。能否使用取決於護照、年齡、註冊資格及機場規定，不能假設四人都能直接使用。</p><div class="actions"><a class="action" href="https://www.k-eta.go.kr/" target="_blank" rel="noopener noreferrer">K-ETA 官方 ↗</a><a class="action" href="https://www.e-arrivalcard.go.kr/" target="_blank" rel="noopener noreferrer">電子入境卡 ↗</a><a class="action" href="https://www.immigration.go.kr/" target="_blank" rel="noopener noreferrer">出入境官方 ↗</a></div></div>
<div class="card"><h3>❄️ 二月天氣・穿搭</h3><p>濟州二月偏冷、海風強，沿海常見約 3～10°C，體感可能更低；山區可能積雪、結冰或封路。</p><span class="pill">防風保暖外套</span><span class="pill">發熱衣＋保暖中層</span><span class="pill">圍巾／手套</span><span class="pill">防滑鞋</span><p>前一晚查看氣象及道路狀況；有冰雪就調整山區行程，不勉強開車。</p><div class="actions"><a class="action" href="https://www.weather.go.kr/" target="_blank" rel="noopener noreferrer">韓國氣象廳 ↗</a></div></div>
<div class="card"><h3>💳 信用卡・韓元現金</h3><p>飯店、百貨、連鎖店通常可刷國際信用卡，但傳統市場、小店與部分無人停車場可能不接受台灣卡。刷卡優先選 <b>KRW 韓元結算</b>，避免動態換匯。</p><p>四人可先以<b>全團 ₩200,000～300,000 現金</b>作為彈性備用額度，並帶兩張不同發卡行的實體信用卡；依實際支出調整。</p></div>
<div class="card"><h3>🅿️ 自駕停車付款｜重要！</h3><div class="notice"><strong>⚠ 台灣信用卡可能刷不過</strong>部分韓國無人停車場只收韓國發行的卡，也可能不收現金。</div><p>優先選免費停車場、飯店附設或有人員管理的停車場。遇付款失敗，按 <b>호출（呼叫）／도움（協助）</b>聯絡管理員。</p><p><b>WOWPASS 也不保證每個停車場能用</b>；出發前可向 LOTTE 租車櫃檯詢問當地付款備案。</p><div class="notice"><strong>🗣 韓文求助</strong>외국 카드로 결제가 안 돼요. 도와주세요.<br>外國信用卡無法付款，可以幫幫我嗎？<br><button class="action" style="margin-top:9px" onclick="copyParkingKorean()">複製韓文</button></div></div>
<div class="card"><h3>💳 WOWPASS・T-money</h3><p><b>WOWPASS</b> 可作旅客預付消費卡；<b>T-money</b> 主要用於交通，兩種餘額分開管理。</p><p>你們四人全程自駕，<b>不需要每人特地辦 T-money</b>。WOWPASS 可當部分消費備援，但停車、加油及押金交易不保證支援；租車押金仍應準備承租人本人信用卡。</p><div class="actions"><a class="action" href="https://www.wowpass.io/" target="_blank" rel="noopener noreferrer">WOWPASS 官方 ↗</a></div></div>
<div class="card"><h3>🧾 韓國購物退稅</h3><p>找有 <b>Tax Free／Tax Refund</b> 標誌的店家，結帳時準備護照並詢問能否即時退稅。常見一般退稅門檻約單筆 <b>₩15,000</b>，但金額上限、適用條件及商品限制須依最新規定。</p><p>未在店內完成退稅時，保留單據與必要商品，依濟州機場當時的退稅、海關指示辦理。市區免稅店購物的取貨方式與一般商店退稅不同。</p><div class="actions"><a class="action" href="https://english.visitkorea.or.kr/" target="_blank" rel="noopener noreferrer">韓國觀光公社 ↗</a></div></div>
